name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Conformance suite (TypeScript reference)
        run: node conformance/run.mjs
      - name: HCS describes itself accurately
        run: node dist/src/cli.js check project.hcs --strict

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund && npm run build
      - name: Conformance suite and unit tests (Python)
        run: python -m unittest discover -s python/tests -v
      - name: Cross-check against the TypeScript reference
        run: python conformance/cross_check.py
