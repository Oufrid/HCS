name: HCS impact
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comment the claims of project.hcs that this pull request touches
        uses: ./
        with:
          file: project.hcs
          mode: impact
